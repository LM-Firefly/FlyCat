# ============================================
# Project Metadata
# ============================================
project.name=FlyCat
project.applicationId=com.github.lmfirefly.flycat
project.version.name=0.5.6
project.version.code=5600
project.jvm=25
# ============================================
# Namespace Configuration (project.namespace.*)
# ============================================
project.namespace.base=com.github.lmfirefly.flycat
project.namespace.core=com.github.lmfirefly.flycat.core
project.namespace.extension=com.github.lmfirefly.flycat.extension
# ============================================
# Android SDK Configuration (android.*)
# ============================================
android.compileSdk=37
android.compileSdkMinor=0
android.minSdk=26
android.targetSdk=37
android.jvm=25
android.ndkVersion=30.0.15729638
# ============================================
# ABI Configuration (abi.*)
# ============================================
abi.app.list=armeabi-v7a,arm64-v8a,x86,x86_64
abi.extension.list=arm64-v8a,x86_64
# ============================================
# Asset URLs (asset.*)
# ============================================
asset.geoip.url=https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb
asset.geosite.url=https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
asset.asn.url=https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb
# ============================================
# Gradle Configuration
# ============================================
# Android
android.useAndroidX=true
android.enableNewApkCreator=true
android.enableR8.fullMode=true
android.r8.gradual.support=true
android.packagingOptions.jniLibs.useLegacyPackaging=false
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8
# Gradle
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configureondemand=false
# Kotlin
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvm.options=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC
kotlin.incremental.multiplatform=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
