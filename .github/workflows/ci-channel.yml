name: CI Channel

on:
  push:
    branches: [ "Yume", "Moe", "Dev" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "website/**"
      - ".gitignore"
  schedule:
    - cron: "0 18 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-channel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# Version counter N = commit count of the built commit (`git rev-list --count HEAD`),
# computed inside reusable-build-apk-only.yml / reusable-prepare-publish.yml after their
# fetch-depth:0 checkouts - no build_number input is passed from here anymore. versionCode
# = project.version.code (gradle.properties) + N, one formula shared by channel, PR and
# official release builds, so releases get unique versionCodes in the same sequence as
# channel packages. Unlike the retired run_number scheme this survives workflow-file
# renames, and it stays monotonic vs already-published packages because the commit count
# grows with every commit and is >= the number of pushes >= run_number. Both channels of
# one run build the same commit -> same versionCode. If history is ever rewritten so the
# count shrinks, bump project.version.code above the last published versionCode.
jobs:
  build-geo-pre:
    name: Geo (Pre)
    uses: ./.github/workflows/reusable-build-geo.yml
    with:
      channel: pre
    secrets: inherit

  build-geo-smart:
    name: Geo (Smart)
    uses: ./.github/workflows/reusable-build-geo.yml
    with:
      channel: smart
    secrets: inherit

  build-native-abi-pre-arm64-v8a:
    name: Native v8a (Pre)
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: pre
      kernel_channel: alpha
      abi: arm64-v8a
    secrets: inherit

  build-native-abi-smart-arm64-v8a:
    name: Native v8a (Smart)
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: smart
      kernel_channel: smart
      abi: arm64-v8a
    secrets: inherit

  bundle-native-pre:
    name: Bundle (Pre)
    needs:
      - build-geo-pre
      - build-native-abi-pre-arm64-v8a
    uses: ./.github/workflows/reusable-bundle-native.yml
    with:
      channel: pre
    secrets: inherit

  bundle-native-smart:
    name: Bundle (Smart)
    needs:
      - build-geo-smart
      - build-native-abi-smart-arm64-v8a
    uses: ./.github/workflows/reusable-bundle-native.yml
    with:
      channel: smart
    secrets: inherit

  build-apk-pre-app:
    name: APK (Pre)
    needs: bundle-native-pre
    uses: ./.github/workflows/reusable-build-apk-only.yml
    with:
      channel: pre
      module: app
      release_tag: Pre-release
      meta_asset_name: YumeBox-pre-meta.json
      raw_apk_artifact_name: apk-raw-pre-app
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  build-apk-smart-app:
    name: APK (Smart)
    needs: bundle-native-smart
    uses: ./.github/workflows/reusable-build-apk-only.yml
    with:
      channel: smart
      module: app
      release_tag: Smart
      meta_asset_name: YumeBox-smart-meta.json
      raw_apk_artifact_name: apk-raw-smart-app
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  prepare-publish-pre-app:
    name: Publish (Pre)
    needs: build-apk-pre-app
    uses: ./.github/workflows/reusable-prepare-publish.yml
    with:
      channel: pre
      module: app
      artifact_prefix: YumeBox
      release_tag: Pre-release
      meta_asset_name: YumeBox-pre-meta.json
      raw_apk_artifact_name: apk-raw-pre-app
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
      apk_name_tail: ${{ needs.build-apk-pre-app.outputs.apk_name_tail }}
    secrets: inherit

  prepare-publish-smart-app:
    name: Publish (Smart)
    needs: build-apk-smart-app
    uses: ./.github/workflows/reusable-prepare-publish.yml
    with:
      channel: smart
      module: app
      artifact_prefix: YumeBox
      channel_segment: smart
      release_tag: Smart
      meta_asset_name: YumeBox-smart-meta.json
      raw_apk_artifact_name: apk-raw-smart-app
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
      apk_name_tail: ${{ needs.build-apk-smart-app.outputs.apk_name_tail }}
    secrets: inherit

  notify-pre:
    name: Notify (Pre)
    needs: prepare-publish-pre-app
    uses: ./.github/workflows/reusable-notify-telegram.yml
    with:
      channel: pre
      apk_artifact_name: ${{ needs.prepare-publish-pre-app.outputs.default_apk_name }}
      telegram_title: YumeBox Pre
    secrets: inherit

  cleanup-artifacts:
    name: Cleanup
    needs:
      - notify-pre
      - prepare-publish-smart-app
    permissions:
      actions: write
    uses: ./.github/workflows/reusable-cleanup-artifacts.yml
