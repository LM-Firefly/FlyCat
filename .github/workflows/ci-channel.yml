name: CI Channel

on:
  push:
    branches: [ "Moes", "Devs" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "website/**"
      - ".gitignore"
  schedule:
    - cron: "0 18 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-channel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-geo-pre:
    name: Geo (Pre)
    uses: ./.github/workflows/reusable-build-geo.yml
    with:
      channel: pre
    secrets: inherit

  build-geo-smart:
    name: Geo (Smart)
    uses: ./.github/workflows/reusable-build-geo.yml
    with:
      channel: smart
    secrets: inherit

  build-native-abi-pre-armeabi-v7a:
    name: Native armeabi-v7a (Pre)
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: pre
      kernel_channel: alpha
      abi: armeabi-v7a
    secrets: inherit

  build-native-abi-pre-arm64-v8a:
    name: Native arm64-v8a (Pre)
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: pre
      kernel_channel: alpha
      abi: arm64-v8a
    secrets: inherit

  build-native-abi-pre-x86:
    name: Native x86 (Pre)
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: pre
      kernel_channel: alpha
      abi: x86
    secrets: inherit

  build-native-abi-pre-x86_64:
    name: Native x86_64 (Pre)
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: pre
      kernel_channel: alpha
      abi: x86_64
    secrets: inherit

  build-native-abi-smart-armeabi-v7a:
    name: Native armeabi-v7a (Smart)
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: smart
      kernel_channel: smart
      abi: armeabi-v7a
    secrets: inherit

  build-native-abi-smart-arm64-v8a:
    name: Native arm64-v8a (Smart)
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: smart
      kernel_channel: smart
      abi: arm64-v8a
    secrets: inherit

  build-native-abi-smart-x86:
    name: Native x86 (Smart)
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: smart
      kernel_channel: smart
      abi: x86
    secrets: inherit

  build-native-abi-smart-x86_64:
    name: Native x86_64 (Smart)
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: smart
      kernel_channel: smart
      abi: x86_64
    secrets: inherit

  bundle-native-pre:
    name: Bundle (Pre)
    needs:
      - build-geo-pre
      - build-native-abi-pre-armeabi-v7a
      - build-native-abi-pre-arm64-v8a
      - build-native-abi-pre-x86
      - build-native-abi-pre-x86_64
    uses: ./.github/workflows/reusable-bundle-native.yml
    with:
      channel: pre
    secrets: inherit

  bundle-native-smart:
    name: Bundle (Smart)
    needs:
      - build-geo-smart
      - build-native-abi-smart-armeabi-v7a
      - build-native-abi-smart-arm64-v8a
      - build-native-abi-smart-x86
      - build-native-abi-smart-x86_64
    uses: ./.github/workflows/reusable-bundle-native.yml
    with:
      channel: smart
    secrets: inherit

  build-apk-pre-app:
    name: APK (Pre)
    needs: bundle-native-pre
    uses: ./.github/workflows/reusable-build-apk-only.yml
    with:
      channel: pre
      module: app
      artifact_prefix: FlyCat-pre
      release_tag: Pre-release
      meta_asset_name: FlyCat-pre-meta.json
      raw_apk_artifact_name: apk-raw-pre-app
      #build_number: ${{ github.run_number }}
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  build-apk-pre-app-with-extension:
    name: APK with Extension (Pre)
    needs: bundle-native-pre
    uses: ./.github/workflows/reusable-build-apk-only.yml
    with:
      channel: pre
      module: app
      artifact_prefix: FlyCat-pre-extension
      release_tag: Pre-release
      meta_asset_name: FlyCat-pre-extension-meta.json
      raw_apk_artifact_name: apk-raw-pre-app-with-extension
      with_extension: true
      #build_number: ${{ github.run_number }}
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  build-apk-pre-extension:
    name: APK Extension Standalone (Pre)
    needs: bundle-native-pre
    uses: ./.github/workflows/reusable-build-apk-only.yml
    with:
      channel: pre
      module: extension
      artifact_prefix: FlyCat-pre-extension-standalone
      release_tag: Pre-release
      meta_asset_name: FlyCat-pre-extension-standalone-meta.json
      raw_apk_artifact_name: apk-raw-pre-extension
      #build_number: ${{ github.run_number }}
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  build-apk-smart-app:
    name: APK (Smart)
    needs: bundle-native-smart
    uses: ./.github/workflows/reusable-build-apk-only.yml
    with:
      channel: smart
      module: app
      artifact_prefix: FlyCat-smart
      release_tag: Smart
      meta_asset_name: FlyCat-smart-meta.json
      raw_apk_artifact_name: apk-raw-smart-app
      #build_number: ${{ github.run_number }}
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  build-apk-smart-app-with-extension:
    name: APK with Extension (Smart)
    needs: bundle-native-smart
    uses: ./.github/workflows/reusable-build-apk-only.yml
    with:
      channel: smart
      module: app
      artifact_prefix: FlyCat-smart-extension
      release_tag: Smart
      meta_asset_name: FlyCat-smart-extension-meta.json
      raw_apk_artifact_name: apk-raw-smart-app-with-extension
      with_extension: true
      #build_number: ${{ github.run_number }}
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  build-apk-smart-extension:
    name: APK Extension Standalone (Smart)
    needs: bundle-native-smart
    uses: ./.github/workflows/reusable-build-apk-only.yml
    with:
      channel: smart
      module: extension
      artifact_prefix: FlyCat-smart-extension-standalone
      release_tag: Smart
      meta_asset_name: FlyCat-smart-extension-standalone-meta.json
      raw_apk_artifact_name: apk-raw-smart-extension
      #build_number: ${{ github.run_number }}
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  prepare-publish-pre-app:
    name: Publish APP (Pre)
    needs: build-apk-pre-app
    uses: ./.github/workflows/reusable-prepare-publish.yml
    with:
      channel: pre
      module: app
      artifact_prefix: FlyCat-pre
      release_tag: Pre-release
      meta_asset_name: FlyCat-pre-meta.json
      raw_apk_artifact_name: apk-raw-pre-app
      publish_artifact_name: publish-pre-app
      #build_number: ${{ github.run_number }}
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  prepare-publish-pre-app-with-extension:
    name: Publish APP with Extension (Pre)
    needs: build-apk-pre-app-with-extension
    uses: ./.github/workflows/reusable-prepare-publish.yml
    with:
      channel: pre
      module: app
      artifact_prefix: FlyCat-pre-extension
      release_tag: Pre-release
      meta_asset_name: FlyCat-pre-extension-meta.json
      raw_apk_artifact_name: apk-raw-pre-app-with-extension
      publish_artifact_name: publish-pre-app-with-extension
      #build_number: ${{ github.run_number }}
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  prepare-publish-pre-extension:
    name: Publish Extension Standalone (Pre)
    needs: build-apk-pre-extension
    uses: ./.github/workflows/reusable-prepare-publish.yml
    with:
      channel: pre
      module: extension
      artifact_prefix: FlyCat-pre-extension-standalone
      release_tag: Pre-release
      meta_asset_name: FlyCat-pre-extension-standalone-meta.json
      raw_apk_artifact_name: apk-raw-pre-extension
      publish_artifact_name: publish-pre-extension
      #build_number: ${{ github.run_number }}
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  prepare-publish-smart-app:
    name: Publish APP (Smart)
    needs: build-apk-smart-app
    uses: ./.github/workflows/reusable-prepare-publish.yml
    with:
      channel: smart
      module: app
      artifact_prefix: FlyCat-smart
      release_tag: Smart
      meta_asset_name: FlyCat-smart-meta.json
      raw_apk_artifact_name: apk-raw-smart-app
      publish_artifact_name: publish-smart-app
      #build_number: ${{ github.run_number }}
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  prepare-publish-smart-app-with-extension:
    name: Publish APP with Extension (Smart)
    needs: build-apk-smart-app-with-extension
    uses: ./.github/workflows/reusable-prepare-publish.yml
    with:
      channel: smart
      module: app
      artifact_prefix: FlyCat-smart-extension
      release_tag: Smart
      meta_asset_name: FlyCat-smart-extension-meta.json
      raw_apk_artifact_name: apk-raw-smart-app-with-extension
      publish_artifact_name: publish-smart-app-with-extension
      #build_number: ${{ github.run_number }}
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  prepare-publish-smart-extension:
    name: Publish Extension Standalone (Smart)
    needs: build-apk-smart-extension
    uses: ./.github/workflows/reusable-prepare-publish.yml
    with:
      channel: smart
      module: extension
      artifact_prefix: FlyCat-smart-extension-standalone
      release_tag: Smart
      meta_asset_name: FlyCat-smart-extension-standalone-meta.json
      raw_apk_artifact_name: apk-raw-smart-extension
      publish_artifact_name: publish-smart-extension
      #build_number: ${{ github.run_number }}
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  publish-release-pre:
    name: Set Release Tag (Pre-release)
    needs:
      - prepare-publish-pre-app
      - prepare-publish-pre-app-with-extension
      - prepare-publish-pre-extension
    uses: ./.github/workflows/reusable-publish-release.yml
    with:
      channel: pre
      release_tag: Pre-release
      release_name: Pre-release
      prerelease: true
      publish_artifacts: publish-pre-app,publish-pre-app-with-extension,publish-pre-extension
      cleanup_assets: true
      delete_existing_release: true
    secrets: inherit

  publish-release-smart:
    name: Set Release Tag (Smart)
    needs:
      - prepare-publish-smart-app
      - prepare-publish-smart-app-with-extension
      - prepare-publish-smart-extension
    uses: ./.github/workflows/reusable-publish-release.yml
    with:
      channel: smart
      release_tag: Smart
      release_name: Smart
      prerelease: true
      publish_artifacts: publish-smart-app,publish-smart-app-with-extension,publish-smart-extension
      cleanup_assets: true
      delete_existing_release: true
    secrets: inherit

