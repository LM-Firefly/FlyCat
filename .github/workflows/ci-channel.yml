name: CI Channel

on:
  push:
    branches: [ "Yume", "Moe", "Dev" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "website/**"
      - ".gitignore"
  schedule:
    - cron: "0 18 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-channel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# Push counter N = this workflow's run_number (versionCode = 5795 + N): it increments once
# per run (one push -> one run), lives on the GitHub side so squash/rebase/force-push can
# never make it go backwards, and needs no extra permissions or API calls. Both channels of
# one run share the same N (same commit -> same versionCode). CAUTION: renaming this
# workflow FILE resets the run_number sequence to 1 - if that ever happens, bump the 5795
# base in app/build.gradle.kts and reusable-prepare-publish.yml above the last published
# versionCode to keep it monotonic.
jobs:
  build-geo-pre:
    uses: ./.github/workflows/reusable-build-geo.yml
    with:
      channel: pre
    secrets: inherit

  build-geo-smart:
    uses: ./.github/workflows/reusable-build-geo.yml
    with:
      channel: smart
    secrets: inherit

  build-native-abi-pre-armeabi-v7a:
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: pre
      kernel_channel: alpha
      abi: armeabi-v7a
    secrets: inherit

  build-native-abi-pre-arm64-v8a:
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: pre
      kernel_channel: alpha
      abi: arm64-v8a
    secrets: inherit

  build-native-abi-pre-x86:
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: pre
      kernel_channel: alpha
      abi: x86
    secrets: inherit

  build-native-abi-pre-x86_64:
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: pre
      kernel_channel: alpha
      abi: x86_64
    secrets: inherit

  build-native-abi-smart-armeabi-v7a:
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: smart
      kernel_channel: smart
      abi: armeabi-v7a
    secrets: inherit

  build-native-abi-smart-arm64-v8a:
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: smart
      kernel_channel: smart
      abi: arm64-v8a
    secrets: inherit

  build-native-abi-smart-x86:
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: smart
      kernel_channel: smart
      abi: x86
    secrets: inherit

  build-native-abi-smart-x86_64:
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: smart
      kernel_channel: smart
      abi: x86_64
    secrets: inherit

  bundle-native-pre:
    needs:
      - build-geo-pre
      - build-native-abi-pre-armeabi-v7a
      - build-native-abi-pre-arm64-v8a
      - build-native-abi-pre-x86
      - build-native-abi-pre-x86_64
    uses: ./.github/workflows/reusable-bundle-native.yml
    with:
      channel: pre
    secrets: inherit

  bundle-native-smart:
    needs:
      - build-geo-smart
      - build-native-abi-smart-armeabi-v7a
      - build-native-abi-smart-arm64-v8a
      - build-native-abi-smart-x86
      - build-native-abi-smart-x86_64
    uses: ./.github/workflows/reusable-bundle-native.yml
    with:
      channel: smart
    secrets: inherit

  build-apk-pre-app:
    needs: bundle-native-pre
    uses: ./.github/workflows/reusable-build-apk-only.yml
    with:
      channel: pre
      module: app
      artifact_prefix: yumebox-pre
      release_tag: Pre-release
      meta_asset_name: yumebox-pre-meta.json
      raw_apk_artifact_name: apk-raw-pre-app
      build_number: ${{ github.run_number }}
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  build-apk-smart-app:
    needs: bundle-native-smart
    uses: ./.github/workflows/reusable-build-apk-only.yml
    with:
      channel: smart
      module: app
      artifact_prefix: yumebox-smart
      release_tag: Smart
      meta_asset_name: yumebox-smart-meta.json
      raw_apk_artifact_name: apk-raw-smart-app
      build_number: ${{ github.run_number }}
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  prepare-publish-pre-app:
    needs: build-apk-pre-app
    uses: ./.github/workflows/reusable-prepare-publish.yml
    with:
      channel: pre
      module: app
      artifact_prefix: yumebox-pre
      release_tag: Pre-release
      meta_asset_name: yumebox-pre-meta.json
      raw_apk_artifact_name: apk-raw-pre-app
      publish_artifact_name: publish-pre-app
      build_number: ${{ github.run_number }}
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  prepare-publish-smart-app:
    needs: build-apk-smart-app
    uses: ./.github/workflows/reusable-prepare-publish.yml
    with:
      channel: smart
      module: app
      artifact_prefix: yumebox-smart
      release_tag: Smart
      meta_asset_name: yumebox-smart-meta.json
      raw_apk_artifact_name: apk-raw-smart-app
      publish_artifact_name: publish-smart-app
      build_number: ${{ github.run_number }}
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  publish-release-pre:
    needs:
      - prepare-publish-pre-app
    uses: ./.github/workflows/reusable-publish-release.yml
    with:
      channel: pre
      release_tag: Pre-release
      release_name: Pre-release
      prerelease: true
      publish_artifacts: publish-pre-app
      recreate_release: true
    secrets: inherit

  publish-release-smart:
    needs: prepare-publish-smart-app
    uses: ./.github/workflows/reusable-publish-release.yml
    with:
      channel: smart
      release_tag: Smart
      release_name: Smart
      prerelease: true
      publish_artifacts: publish-smart-app
      recreate_release: true
    secrets: inherit

  notify-pre:
    needs:
      - prepare-publish-pre-app
      - publish-release-pre
    uses: ./.github/workflows/reusable-notify-telegram.yml
    with:
      channel: pre
      release_tag: Pre-release
      publish_artifact_name: publish-pre-app
      meta_asset_name: yumebox-pre-meta.json
      telegram_title: YumeBox Pre
    secrets: inherit
