name: Reusable Prepare Publish

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      module:
        required: true
        type: string
      artifact_prefix:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      meta_asset_name:
        required: true
        type: string
      raw_apk_artifact_name:
        required: true
        type: string
      publish_artifact_name:
        required: true
        type: string
      build_number:
        description: "Deprecated; versionCode is now derived from the build timestamp (yyyyMMdd)."
        required: false
        type: string
        default: ""
      build_hash:
        description: "Commit sha of the build; first 8 chars go into versionName (<base>[.<branch>].<hash8>)."
        required: false
        type: string
        default: ""
      build_branch:
        description: "Branch name; normalized into the versionName branch segment."
        required: false
        type: string
        default: ""
      checkout_ref:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Download raw APK artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.raw_apk_artifact_name }}
          path: output_apk/release

      - name: Read version info
        id: version
        shell: bash
        env:
          BUILD_HASH: ${{ inputs.build_hash }}
          BUILD_BRANCH: ${{ inputs.build_branch }}
        run: |
          set -eu
          base_version_name="$(grep '^project.version.name=' product.properties | cut -d= -f2-)"
          branch_segment="$(printf '%s' "${BUILD_BRANCH}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -e 's/[^a-z0-9]/-/g' -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')"

          if [ -n "${BUILD_HASH}" ]; then
            if [ -n "${branch_segment}" ]; then
              version_name="${base_version_name}.${branch_segment}.${BUILD_HASH:0:8}"
            else
              version_name="${base_version_name}.${BUILD_HASH:0:8}"
            fi
          else
            version_name="${base_version_name}"
          fi

          version_code="$(TZ=Asia/Shanghai date +%Y%m%d)"
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        run: |
          set -eu
          mkdir -p publish/meta
          notes_file="publish/meta/release-notes.txt"

          if [ "${{ inputs.channel }}" = "stable" ]; then
            prev_tag="$(git tag --sort=-version:refname | grep '^v' | grep -Fxv "${{ inputs.release_tag }}" | head -n 1 || true)"
            if [ -n "$prev_tag" ]; then
              git log --pretty='- %s (%h)' "${prev_tag}..HEAD" > "$notes_file"
            else
              git log --pretty='- %s (%h)' -n 20 > "$notes_file"
            fi
          else
            git log --pretty='- %s (%h)' -n 20 > "$notes_file"
          fi

          if [ ! -s "$notes_file" ]; then
            echo "- No release notes." > "$notes_file"
          fi

      - name: Prepare publish artifacts
        shell: bash
        run: |
          set -eu
          mkdir -p publish
          version_name="${{ steps.version.outputs.version_name }}"
          version_code="${{ steps.version.outputs.version_code }}"
          release_url="https://github.com/${{ github.repository }}/releases/tag/${{ inputs.release_tag }}"
          publish_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          while IFS= read -r file; do
            base="$(basename "$file")"
            # 原始产物命名契约（app/extension 命名块；geo 标记段已移除）：
            # <前缀>[-Extension]-<abi>[-<channel>]-release-<yyyyMMddHHmm>-<hash>.apk
            # 按连字符段一次性严格提取 abi 与 build_id，形态不符即视为命名回归并报错（不再用子串通配猜 ABI）。
            if [[ "$base" =~ ^.+-(arm64-v8a|armeabi-v7a|x86_64|x86|universal32|universal64)(-[A-Za-z0-9.]+)?-release-([0-9]{12}-[0-9a-fA-F]{5,8})\.apk$ ]]; then
              abi="${BASH_REMATCH[1]}"
              build_id="${BASH_REMATCH[3]}"
            else
              echo "::error::Unexpected APK name shape (want <prefix>[-Extension]-<abi>[-<channel>]-release-<buildId>.apk): $base" >&2
              exit 1
            fi
            new_name="${{ inputs.artifact_prefix }}-${abi}-${build_id}.apk"
            cp -f "$file" "publish/${new_name}"
            if [ -f "${file}.json" ]; then
              cp -f "${file}.json" "publish/${new_name}.json"
            fi
          done < <(find "output_apk/release" -maxdepth 1 -type f -name '*.apk' | sort)

          if [ ! -d publish ] || [ -z "$(ls -A publish)" ]; then
            echo "No APK generated" >&2
            exit 1
          fi

          export CHANNEL="${{ inputs.channel }}"
          export MODULE="${{ inputs.module }}"
          export ARTIFACT_PREFIX="${{ inputs.artifact_prefix }}"
          export RELEASE_TAG="${{ inputs.release_tag }}"
          export META_ASSET_NAME="${{ inputs.meta_asset_name }}"
          export VERSION_NAME="${version_name}"
          export VERSION_CODE="${version_code}"
          export RELEASE_URL="${release_url}"
          export PUBLISHED_AT="${publish_time}"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          publish_dir = Path("publish")
          release_notes_path = Path("publish/meta/release-notes.txt")
          channel = os.environ["CHANNEL"]
          module = os.environ["MODULE"]
          artifact_prefix = os.environ["ARTIFACT_PREFIX"]
          release_tag = os.environ["RELEASE_TAG"]
          meta_asset_name = os.environ["META_ASSET_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          version_name = os.environ["VERSION_NAME"]
          version_code = int(os.environ["VERSION_CODE"])
          release_url = os.environ["RELEASE_URL"]
          published_at = os.environ["PUBLISHED_AT"]
          release_notes = release_notes_path.read_text(encoding="utf-8").strip() if release_notes_path.exists() else ""

          packages = []
          # 发布文件名形态：<前缀>-<abi>-<yyyyMMddHHmm>-<hash>.apk（由上方 bash 按原始形态
          # <前缀>[-Extension]-<abi>[-<channel>]-release-<buildId>.apk 重命名而来；geo 标记段已移除）。
          # 旧式 "-<abi>.apk" 尾缀匹配永不命中此形态（曾导致 meta 内 abi 全部误标为 universal），改按完整尾缀正则提取。
          # 产物线契约只有 universal32/universal64 两分支（4 ABI 总 universal 已弃用），匹配不到即视为命名回归。
          abi_pattern = re.compile(
              r"-(arm64-v8a|armeabi-v7a|x86_64|x86|universal32|universal64)-[0-9]{12}-[0-9a-fA-F]{5,8}\.apk$"
          )
          for apk in sorted(publish_dir.glob("*.apk")):
              name = apk.name
              match = abi_pattern.search(name)
              if not match:
                  raise SystemExit(f"Unknown ABI segment in {name}")
              abi = match.group(1)

              h = hashlib.sha256()
              with apk.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)

              packages.append({
                  "abi": abi,
                  "fileName": name,
                  "downloadUrl": f"https://github.com/{repo}/releases/download/{release_tag}/{name}",
                  "size": apk.stat().st_size,
                  "sha256": h.hexdigest(),
                  "isUniversal": abi.startswith("universal"),
              })

          meta = {
              "schemaVersion": 1,
              "channel": channel,
              "module": module,
              "artifactPrefix": artifact_prefix,
              "tag": release_tag,
              "versionName": version_name,
              "versionCode": version_code,
              "publishedAt": published_at,
              "commitSha": sha,
              "releaseNotes": release_notes,
              "releaseUrl": release_url,
              "packages": packages,
          }

          meta_dir = Path("publish/meta")
          meta_dir.mkdir(parents=True, exist_ok=True)
          (meta_dir / meta_asset_name).write_text(
              json.dumps(meta, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.publish_artifact_name }}
          path: |
            publish/*.apk
            publish/*.apk.json
          if-no-files-found: error
