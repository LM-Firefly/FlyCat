name: Build APK

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      module:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      meta_asset_name:
        required: true
        type: string
      raw_apk_artifact_name:
        required: true
        type: string
      build_hash:
        description: "Commit sha of the build; first 8 chars go into versionName (<base>[.<branch>].<hash8>)."
        required: false
        type: string
        default: ""
      build_branch:
        description: "Branch name; normalized (lowercase, [^a-z0-9] runs -> '-') into the versionName branch segment."
        required: false
        type: string
        default: ""
    outputs:
      apk_name_tail:
        description: "Tail used in Gradle's published APK file names; channel and PR builds use one Asia/Shanghai packaging date, stable builds use the clean version name."
        value: ${{ jobs.build.outputs.apk_name_tail }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk_name_tail: ${{ steps.apk_name.outputs.tail }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      # Build number N = commit count of the built commit's parent chain. Computed here
      # instead of taken from the caller so ci-channel, pull-request and release all share
      # one versionCode formula: epoch (project.version.code in gradle.properties) + N.
      # Requires the fetch-depth:0 checkout above - a shallow clone would count 1.
      # Monotonic vs the retired ci-channel run_number scheme (commit count >= pushes >=
      # run_number) and immune to workflow-file renames. reusable-prepare-publish.yml
      # recomputes the same N from the same github.sha.
      - name: Compute build number
        id: build_number
        shell: bash
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "24"

      - name: Setup Kotlin
        uses: fwilhe2/setup-kotlin@88d53291848568823e529973af5d0cdb8ddf8d87 # main

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v5
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/30.0.14904198
          key: ${{ runner.os }}-ndk-30.0.14904198-v2
          restore-keys: |
            ${{ runner.os }}-ndk-30.0.14904198-v2-

      - name: Install NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;30.0.14904198"

      - name: Configure local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "ndk.dir=${ANDROID_SDK_ROOT}/ndk/30.0.14904198" >> local.properties

      - name: Download native artifact
        uses: actions/download-artifact@v8
        with:
          name: native-${{ inputs.channel }}

      - name: Verify native and geo inputs
        shell: bash
        run: |
          set -eu
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -f "jniLibs/${abi}/libmihomo.so"
            test -f "jniLibs/${abi}/libmihomocore.so"
            test -f "jniLibs/${abi}/liboverride.so"
            test -f "jniLibs/${abi}/libcompat.so"
            test -f "jniLibs/${abi}/libloader.so"
          done
          # Core branch/hash stamp from the native job (About / BuildConfig.CORE_*).
          test -f "jniLibs/arm64-v8a/core-version.properties" || test -f "build/generated/core-version.properties"
          test -f "build/generated/assets/geo/geoip.metadb.xz"
          test -f "build/generated/assets/geo/geosite.dat.xz"
          test -f "build/generated/assets/geo/ASN.mmdb.xz"
          test -f "build/generated/assets/geo/BundleMRS.7z"

      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${SIGNING_KEYSTORE_BASE64}" ]; then
            printf '%s' "${SIGNING_KEYSTORE_BASE64}" | base64 --decode > release.keystore
          fi

      - name: Write signing config
        run: |
          if [ -n "${{ secrets.SIGNING_STORE_PASSWORD }}" ]; then
            echo "keystore.password=${{ secrets.SIGNING_STORE_PASSWORD }}" > signing.properties
            echo "key.alias=${{ secrets.SIGNING_KEY_ALIAS }}" >> signing.properties
            echo "key.password=${{ secrets.SIGNING_KEY_PASSWORD }}" >> signing.properties
            echo "keystore.path=release.keystore" >> signing.properties
          fi

      - name: Compute APK output name
        id: apk_name
        shell: bash
        env:
          BUILD_HASH: ${{ inputs.build_hash }}
        run: |
          set -eu
          if [ -n "${BUILD_HASH}" ]; then
            tail="$(TZ=Asia/Shanghai date +%y.%m.%d)"
          else
            tail="$(grep '^project.version.name=' gradle.properties | cut -d= -f2-)"
          fi
          case "${{ inputs.channel }}" in
            smart|pr) channel_segment="${{ inputs.channel }}" ;;
            pre|stable) channel_segment="" ;;
            *) echo "Unsupported APK output channel: ${{ inputs.channel }}" >&2; exit 1 ;;
          esac
          echo "tail=${tail}" >> "$GITHUB_OUTPUT"
          echo "channel_segment=${channel_segment}" >> "$GITHUB_OUTPUT"

      - name: Build Release APKs (geo + nogeo)
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.value }}
          BUILD_HASH: ${{ inputs.build_hash }}
          BUILD_BRANCH: ${{ inputs.build_branch }}
        run: |
          set -eu
          chmod +x gradlew
          common_args=(
            -Pupdate.channel="${{ inputs.channel }}"
            -Pupdate.tag="${{ inputs.release_tag }}"
            -Pupdate.metaAssetName="${{ inputs.meta_asset_name }}"
            -Pbuild.number="${BUILD_NUMBER}"
            -Pbuild.hash="${BUILD_HASH:0:8}"
            -Pbuild.branch="${BUILD_BRANCH}"
            -Pbuild.allAbis=true
            -Papk.output.tail="${{ steps.apk_name.outputs.tail }}"
            -Papk.output.channel="${{ steps.apk_name.outputs.channel_segment }}"
          )
          ./gradlew --no-daemon "${common_args[@]}" -Pgeo.bundle=true :${{ inputs.module }}:assembleRelease
          # Stage the geo APKs before the second pass: the package task cleans stale files
          # it owns, so the two variants cannot share the outputs directory.
          mkdir -p apk-stage
          cp ${{ inputs.module }}/build/outputs/apk/release/*.apk apk-stage/
          # Second pass only re-merges assets and re-packages; compile and R8 stay
          # up to date because geo.bundle feeds no compiler input (no BuildConfig field).
          ./gradlew --no-daemon "${common_args[@]}" -Pgeo.bundle=false :${{ inputs.module }}:assembleRelease
          cp ${{ inputs.module }}/build/outputs/apk/release/*.apk apk-stage/

      - name: Verify staged APK matrix
        shell: bash
        run: |
          set -eu
          tail="${{ steps.apk_name.outputs.tail }}"
          channel_segment="${{ steps.apk_name.outputs.channel_segment }}"
          channel_suffix="${channel_segment:+-${channel_segment}}"
          ls "apk-stage/YumeBox-external${channel_suffix}-${tail}.apk"
          ls "apk-stage/YumeBox-external-universal${channel_suffix}-${tail}.apk"
          ls "apk-stage/YumeBox-builtin${channel_suffix}-${tail}.apk"
          ls "apk-stage/YumeBox-builtin-universal${channel_suffix}-${tail}.apk"

      - name: Write APK guide summary
        shell: bash
        env:
          TAIL: ${{ steps.apk_name.outputs.tail }}
          CHANNEL_SEGMENT: ${{ steps.apk_name.outputs.channel_segment }}
        run: |
          seg="${CHANNEL_SEGMENT:+-${CHANNEL_SEGMENT}}"
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Which APK should I download?

          File name format:

          ```
          YumeBox-<geo>[-<abi>][-<channel>]-<tail>.apk
          ```

          ### Geo databases — `<geo>`
          | Segment | Geo data (geoip / geosite / ASN) | APK size | Choose when |
          |---|---|---|---|
          | `builtin` | Bundled inside the APK | Larger | You want it working right after install, with no first-run download |
          | `external` | Downloaded by the core at runtime | Smaller | You want the smallest APK and have network on first use |

          ### Architecture — `<abi>`
          | Segment | CPU / device | Choose when |
          |---|---|---|
          | *(none)* | **arm64-v8a** | **Virtually every phone from the last ~8 years — the default** |
          | `armeabi-v7a` | 32-bit ARM | Old / low-end devices |
          | `x86_64` | 64-bit x86 | Emulators, x86 tablets, ChromeOS |
          | `x86` | 32-bit x86 | Old emulators |
          | `universal` | All ABIs in one file | Unsure — largest, runs anywhere |

          > **arm64-v8a carries no abi segment** (it is the default). A name with no abi segment is an arm64-v8a build.

          ### Channel — `<channel>`
          | Segment | Channel |
          |---|---|
          | *(none)* | Pre-release / Stable |
          | `smart` | Smart channel |
          | `pr` | Pull-request build |

          `<tail>` is the packaging date `yy.mm.dd` for channel / PR builds, or the version name for stable releases.
          EOF
          printf '\n**Most people want** `%s` — arm64 + bundled geo.\n' "YumeBox-builtin${seg}-${TAIL}.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.raw_apk_artifact_name }}
          path: apk-stage/*.apk
          if-no-files-found: error
          # APKs are already zip-compressed; store them uncompressed in the artifact zip.
          compression-level: 0
