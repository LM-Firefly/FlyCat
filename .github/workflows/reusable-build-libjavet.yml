name: Reusable Build libjavet

on:
  workflow_call:
    inputs:
      artifact_name:
        description: "Name for the uploaded artifact"
        required: true
        type: string
      checkout_ref:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "26"

      - name: Cache Kotlin Toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            .kotlin/flycat/maven
            .kotlin/flycat/gradle-*
          key: ${{ runner.os }}-toolchain-${{ hashFiles('kotlin', '*module-template.yaml', '**/module.yaml', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-toolchain-

      - name: Configure local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Build libjavet.so.xz
        run: |
          sh kotlin run -m packaging -- --module=extension --build-type=release --javet-assets

      - name: Verify output
        run: |
          set -eu
          test -f "build/generated/libjavet/libjavet-arm64-v8a.so.xz"
          test -f "build/generated/libjavet/libjavet-x86_64.so.xz"
          ls -lh build/generated/libjavet/

      - name: Upload libjavet artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            build/generated/libjavet/libjavet-arm64-v8a.so.xz
            build/generated/libjavet/libjavet-x86_64.so.xz
          if-no-files-found: error
          compression-level: 0
