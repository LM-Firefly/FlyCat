#-------------------------------------------------------------------------------#
#        Discover additional configuration options in our documentation         #
#               https://www.jetbrains.com/help/qodana/github.html               #
#-------------------------------------------------------------------------------#

name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - Moe
      - Dev

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # :locale 模块现在是直接提交的 Kotlin 代码（FlyTxt + Lyricist），因此 Qodana 的 Gradle 导入/分析解析引用时无需代码生成。（原生 .so 库并非必需——它们在运行时加载，而不是在 Kotlin 分析期间。）
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
      - name: Setup Kotlin
        uses: fwilhe2/setup-kotlin@main
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Generate locale sources
        shell: bash
        run: |
          set -eu
          chmod +x gradlew
          ./gradlew --no-daemon :locale:kspDebugKotlin
          test -s locale/build/generated/ksp/debug/kotlin/cafe/adriel/lyricist/Strings.kt
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          # 当 pr-mode 设置为 true 时，Qodana 仅分析已更改的文件。
          pr-mode: false
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          # 将 Qodana 结果（SARIF、其他工件、日志）作为工件上传到任务
          upload-result: false
          # Ultimate 和 Ultimate Plus 计划中提供的快速修复
          push-fixes: 'none'
