#-------------------------------------------------------------------------------#
#        Discover additional configuration options in our documentation         #
#               https://www.jetbrains.com/help/qodana/github.html               #
#-------------------------------------------------------------------------------#

name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - Moe
      - Dev

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # :locale 模块现在是直接提交的 Kotlin 代码（FlyTxt + Lyricist），因此 Qodana 的 Gradle 导入/分析解析引用时无需代码生成。（原生 .so 库并非必需——它们在运行时加载，而不是在 Kotlin 分析期间。）
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
      - name: Cache Kotlin Toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            .kotlin/flycat/maven
            .kotlin/flycat/gradle-*
          key: ${{ runner.os }}-toolchain-${{ hashFiles('kotlin', '*module-template.yaml', '**/module.yaml', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-toolchain-
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"
      - name: Configure local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
      - name: Generate locale sources
        shell: bash
        run: |
          set -eu
          sh kotlin build -m locale
          find build -path '*ksp*' -name Strings.kt -size +0c -print -quit | grep -q .
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          # 当 pr-mode 设置为 true 时，Qodana 仅分析已更改的文件。
          pr-mode: false
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          # 将 Qodana 结果（SARIF、其他工件、日志）作为工件上传到任务
          upload-result: false
          # Ultimate 和 Ultimate Plus 计划中提供的快速修复
          push-fixes: 'none'
