name: Release Stable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Stable release tag, for manual run (example: v0.5.0)"
        required: true
        type: string

concurrency:
  group: release-stable-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        run: |
          set -eu
          release_tag="${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}"
          expected_version="${release_tag#v}"
          actual_version="$(grep '^project.version.name=' gradle.properties | cut -d= -f2-)"
          if [ "${actual_version}" != "${expected_version}" ]; then
            echo "::error::release tag ${release_tag} expects project.version.name=${expected_version}, got ${actual_version}"
            exit 1
          fi

  build-geo-stable:
    uses: ./.github/workflows/reusable-build-geo.yml
    with:
      channel: stable
    secrets: inherit

  build-native-abi-stable-armeabi-v7a:
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: stable
      kernel_channel: alpha
      abi: armeabi-v7a
    secrets: inherit

  build-native-abi-stable-arm64-v8a:
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: stable
      kernel_channel: alpha
      abi: arm64-v8a
    secrets: inherit

  build-native-abi-stable-x86:
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: stable
      kernel_channel: alpha
      abi: x86
    secrets: inherit

  build-native-abi-stable-x86_64:
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: stable
      kernel_channel: alpha
      abi: x86_64
    secrets: inherit

  bundle-native-stable:
    needs:
      - build-geo-stable
      - build-native-abi-stable-armeabi-v7a
      - build-native-abi-stable-arm64-v8a
      - build-native-abi-stable-x86
      - build-native-abi-stable-x86_64
    uses: ./.github/workflows/reusable-bundle-native.yml
    with:
      channel: stable
    secrets: inherit

  build-apk-stable-app:
    needs:
      - validate-version
      - bundle-native-stable
    uses: ./.github/workflows/reusable-build-apk-only.yml
    with:
      channel: stable
      module: app
      artifact_prefix: FlyCat-stable
      release_tag: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      meta_asset_name: FlyCat-stable-meta.json
      raw_apk_artifact_name: apk-raw-stable-app
      build_number: ${{ github.run_number }}
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  build-apk-stable-app-with-extension:
    needs:
      - validate-version
      - bundle-native-stable
    uses: ./.github/workflows/reusable-build-apk-only.yml
    with:
      channel: stable
      module: app
      artifact_prefix: FlyCat-stable-extension
      release_tag: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      meta_asset_name: FlyCat-stable-extension-meta.json
      raw_apk_artifact_name: apk-raw-stable-app-with-extension
      with_extension: true
      build_number: ${{ github.run_number }}
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  build-apk-stable-extension:
    needs:
      - validate-version
      - bundle-native-stable
    uses: ./.github/workflows/reusable-build-apk-only.yml
    with:
      channel: stable
      module: extension
      artifact_prefix: FlyCat-stable-extension-standalone
      release_tag: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      meta_asset_name: FlyCat-stable-extension-standalone-meta.json
      raw_apk_artifact_name: apk-raw-stable-extension
      build_number: ${{ github.run_number }}
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  prepare-publish-stable-app:
    needs:
      - build-apk-stable-app
    uses: ./.github/workflows/reusable-prepare-publish.yml
    with:
      channel: stable
      module: app
      artifact_prefix: FlyCat-stable
      release_tag: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      meta_asset_name: FlyCat-stable-meta.json
      raw_apk_artifact_name: apk-raw-stable-app
      publish_artifact_name: publish-stable-app
    secrets: inherit

  prepare-publish-stable-app-with-extension:
    needs:
      - build-apk-stable-app-with-extension
    uses: ./.github/workflows/reusable-prepare-publish.yml
    with:
      channel: stable
      module: app
      artifact_prefix: FlyCat-stable-extension
      release_tag: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      meta_asset_name: FlyCat-stable-extension-meta.json
      raw_apk_artifact_name: apk-raw-stable-app-with-extension
      publish_artifact_name: publish-stable-app-with-extension
    secrets: inherit

  prepare-publish-stable-extension:
    needs:
      - build-apk-stable-extension
    uses: ./.github/workflows/reusable-prepare-publish.yml
    with:
      channel: stable
      module: extension
      artifact_prefix: FlyCat-stable-extension-standalone
      release_tag: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      meta_asset_name: FlyCat-stable-extension-standalone-meta.json
      raw_apk_artifact_name: apk-raw-stable-extension
      publish_artifact_name: publish-stable-extension
    secrets: inherit

  prepare-publish-extension-standalone:
    needs:
      - build-apk-stable-extension
    uses: ./.github/workflows/reusable-prepare-publish.yml
    with:
      channel: extension
      module: extension
      artifact_prefix: FlyCat-stable-extension-standalone
      release_tag: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      meta_asset_name: FlyCat-stable-extension-standalone-meta.json
      raw_apk_artifact_name: apk-raw-stable-extension
      publish_artifact_name: publish-extension-standalone
    secrets: inherit

  publish-release-stable:
    needs:
      - prepare-publish-stable-app
      - prepare-publish-stable-app-with-extension
      - prepare-publish-stable-extension
    uses: ./.github/workflows/reusable-publish-release.yml
    with:
      channel: stable
      release_tag: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      release_name: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      prerelease: false
      publish_artifacts: publish-stable-app,publish-stable-app-with-extension,publish-stable-extension
      cleanup_assets: false
    secrets: inherit

  publish-release-extension:
    needs:
      - prepare-publish-extension-standalone
    uses: ./.github/workflows/reusable-publish-release.yml
    with:
      channel: extension
      release_tag: Extension
      release_name: Extension
      prerelease: true
      delete_existing_release: true
      publish_artifacts: publish-extension-standalone
      cleanup_assets: false
    secrets: inherit

