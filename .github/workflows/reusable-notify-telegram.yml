name: Notify Telegram

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      apk_artifact_name:
        description: "Exact per-APK artifact/file name to download and push — pass reusable-prepare-publish.yml's default_apk_name output (the arm64-v8a external-geo APK)."
        required: true
        type: string
      telegram_title:
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Telegram gets exactly one file: the arm64-v8a external-geo APK. The artifact
      # name equals the publish file name (archive:false uploads in
      # reusable-prepare-publish.yml) and is passed in from that workflow's
      # default_apk_name output — never recompute it here (the date segment is
      # stamped once in prepare-publish).
      - name: Download arm64-v8a (external geo) APK artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.apk_artifact_name }}
          path: publish

      - name: Check upload availability
        id: check_upload
        shell: bash
        run: |
          if [ -n "${{ secrets.BOT_TOKEN }}" ]; then
            echo "UPLOAD=true" >> "$GITHUB_OUTPUT"
          else
            echo "UPLOAD=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bot session cache
        if: steps.check_upload.outputs.UPLOAD == 'true'
        uses: actions/cache@v5
        with:
          path: scripts/yumebot.session
          key: ${{ runner.os }}-bot-session-${{ github.ref_name }}-${{ inputs.channel }}
          restore-keys: |
            ${{ runner.os }}-bot-session-${{ github.ref_name }}-
            ${{ runner.os }}-bot-session-

      - name: Upload to Telegram
        if: steps.check_upload.outputs.UPLOAD == 'true'
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MESSAGE_THREAD_ID: ${{ secrets.MESSAGE_THREAD_ID }}
          TITLE: ${{ inputs.telegram_title }}
          BRANCH: ${{ github.ref_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          PUBLISH_DIR: publish
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          LOGO_URL: https://yumebox.gal.tf/images/og.webp
        run: python3 $GITHUB_WORKSPACE/scripts/yumebot.py
