[package]
name = "loader"
version = "0.1.0"
edition = "2024"

[lib]
name = "loader"
crate-type = ["cdylib"]

[dependencies]
jni = "0.22"
libc = "0.2"
lzma-rs = "0.3"
sha2 = "0.11"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
debug = false
incremental = false
strip = true
