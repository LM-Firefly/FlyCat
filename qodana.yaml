#-------------------------------------------------------------------------------#
#               Qodana analysis configuration for YumeBox                        #
#        https://www.jetbrains.com/help/qodana/qodana-yaml.html                  #
#-------------------------------------------------------------------------------#

version: "1.0"

linter: jetbrains/qodana-jvm-android:2026.2-eap

# Built-in inspection profile. Use qodana.starter for a lighter, lower-noise first run.
profile:
  name: qodana.recommended


# Qodana's Android image auto-installs missing platforms during Gradle import.
# API 37 + build-tools 36 occasionally land as truncated zips (ZipException /
# corrupt source.properties). Repair them before project open so analysis can start.
bootstrap: |
  set -eu
  SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android-sdk}}"
  echo "Qodana bootstrap: repairing Android SDK under $SDK"
  rm -rf \
    "$SDK/build-tools/36.0.0" \
    "$SDK/platforms/android-37" \
    "$SDK/platforms/android-37.0" \
    "$SDK/.temp" \
    "$SDK/temp" \
    "$SDK/.downloadIntermediates" || true
  mkdir -p "$SDK/licenses"
  # Accept all licenses non-interactively (sdkmanager prints many prompts).
  yes 2>/dev/null | sdkmanager --sdk_root="$SDK" --licenses >/dev/null || true
  install_ok=0
  for attempt in 1 2 3 4 5; do
    echo "sdkmanager install attempt $attempt"
    # Prefer the base platform package; some SDK indexes also expose android-37.0.
    if sdkmanager --sdk_root="$SDK" --install "build-tools;36.0.0" \
      && (sdkmanager --sdk_root="$SDK" --install "platforms;android-37" \
          || sdkmanager --sdk_root="$SDK" --install "platforms;android-37.0"); then
      install_ok=1
      break
    fi
    echo "sdkmanager failed on attempt $attempt; cleaning partial packages and retrying"
    rm -rf \
      "$SDK/build-tools/36.0.0" \
      "$SDK/platforms/android-37" \
      "$SDK/platforms/android-37.0" \
      "$SDK/.temp" \
      "$SDK/temp" || true
    sleep $((attempt * 3))
  done

  if [ "$install_ok" != "1" ]; then
    echo "FATAL: failed to install platforms;android-37 / build-tools;36.0.0" >&2
    exit 1
  fi
  # AGP with compileSdkMinor may look for android-37.0; accept either layout.
  if [ ! -f "$SDK/platforms/android-37/android.jar" ] && [ ! -f "$SDK/platforms/android-37.0/android.jar" ]; then
    echo "FATAL: android.jar missing after sdkmanager install" >&2
    ls -la "$SDK/platforms" || true
    exit 1
  fi
  if [ ! -f "$SDK/build-tools/36.0.0/source.properties" ]; then
    echo "FATAL: build-tools 36.0.0 source.properties missing" >&2
    ls -la "$SDK/build-tools" || true
    exit 1
  fi
  # AGP 9 with compileSdkMinor may resolve platform dir as android-37.0.
  if [ -f "$SDK/platforms/android-37/android.jar" ] && [ ! -e "$SDK/platforms/android-37.0" ]; then
    ln -s android-37 "$SDK/platforms/android-37.0"
    echo "linked platforms/android-37.0 -> android-37"
  fi
  if [ -f "$SDK/platforms/android-37.0/android.jar" ] && [ ! -e "$SDK/platforms/android-37" ]; then
    ln -s android-37.0 "$SDK/platforms/android-37"
    echo "linked platforms/android-37 -> android-37.0"
  fi
  echo "Qodana bootstrap: Android SDK ready"
  sdkmanager --sdk_root="$SDK" --list_installed | sed -n '1,80p' || true


# Kotlin/Java static analysis only. Exclude everything that is not app source:
#  - lib/      native libs (Go PIE libclash, Rust liboverride, C libcompat/libloader) + mihomo
#  - scripts/  standalone *.main.kts build tooling (native-build / locale codegen)
#  - website/  documentation site (mdx/css)
#  - .trellis/ task-management workspace
# Module build/ output is git-ignored and excluded automatically.
exclude:
  - name: All
    paths:
      - lib
      - scripts
      - website
      - .trellis

  # pack/ is a flat Java source set (src/*.java) with package dev.yume.loader; directory layout is intentional.
  - name: WrongPackageStatement
    paths:
      - pack
  # Feature modules and pack use non-package-path source roots by design.
  - name: PackageDirectoryMismatch
  # NewApi findings either gated by RequiresApi or intentional platform-loader paths.
  - name: AndroidLintNewApi

  # Manifest placeholders (${applicationClass}) are expanded per build variant.
  - name: AndroidDomInspection
    paths:
      - app/AndroidManifest.xml

  # Compose / public API style that conflicts with Jetpack Compose conventions.
  - name: FunctionName
  - name: BooleanLiteralArgument
  - name: ConstPropertyName
  - name: ObjectPropertyName
  - name: PropertyName
  - name: SortModifiers
  - name: CanBeParameter
  - name: MayBeConstant
  - name: ConvertToStringTemplate
  - name: RemoveExplicitTypeArguments
  - name: UsePropertyAccessSyntax
  - name: CanConvertToMultiDollarString
  - name: IntroduceWhenSubject
  - name: ConvertLongToDuration
  - name: SimplifiableCallChain
  - name: UnnecessaryOptInAnnotation
  - name: KDocUnresolvedReference
  - name: AndroidLintUseTomlInstead
  - name: AndroidLintIconDuplicates
  - name: AndroidLintNewerVersionAvailable
  - name: AndroidLintVectorRaster
  - name: AndroidLintUnusedAttribute
  - name: AndroidLintUseKtx
  - name: AndroidLintObsoleteSdkInt
  - name: AndroidLintGradleDependency
  - name: AndroidLintBatteryLife
  - name: AndroidLintAppBundleLocaleChanges
  - name: AndroidLintSetWorldReadable
  - name: AndroidLintPrivateApi
  - name: AndroidLintUnusedResources
  - name: DuplicatedCode
  - name: UnusedReceiverParameter
  - name: UnusedSymbol
  - name: JavaDefaultMethodsNotOverriddenByDelegation
  - name: DeprecatedCallableAddReplaceWith
  - name: AndroidLintStartActivityAndCollapseDeprecated

  # Generated / bridge noise (pack loader reflection and intentional ignore patterns).
  - name: NullableProblems
  - name: DataFlowIssue
  - name: IgnoreResultOfCall

  # Residual SARIF backlog rules (fixed in code and/or accepted noise).
  - name: KotlinUnusedImport
  - name: KotlinConstantConditions
  - name: RedundantIf
  - name: UnusedVariable
  - name: KotlinDeprecation
  - name: RedundantNullableReturnType
  - name: RedundantSuspendModifier
  - name: AndroidLintEmptySuperCall
  - name: ConvertTryFinallyToUseCall
  - name: DuplicateArgumentsInSetOfAndMapOfFunctions
  - name: RegExpSimplifiable
  - name: AndroidLintUseRequiresApi
  - name: BlockingMethodInNonBlockingContext
  - name: CanUnescapeDollarLiteral
  - name: JavaExistingMethodCanBeUsed
  - name: RegExpUnnecessaryNonCapturingGroup
  - name: ReplaceIsEmptyWithIfEmpty
  - name: ReplaceRangeToWithRangeUntil
  - name: SizeReplaceableByIsEmpty
  - name: UnnecessaryVariable
  - name: UnusedExpression
  - name: AndroidLintMissingTranslation
  - name: AndroidLintMissingPermission
  - name: AndroidLintWrongGradleMethod
  - name: ShrinkerUnresolvedReference
