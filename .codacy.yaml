---
engines:
  lizard:
    exclude_paths:
      - "**/*.kt"
      - "**/*.kts"
  spectral:
    exclude_paths:
      - "website/api/openapi.json"
  # JSHint and Biome do not understand Vue single-file templates and report
  # template-only bindings as unused JavaScript.
  jshint:
    exclude_paths:
      - "website/.vitepress/theme/components/*.vue"
      - "website/.vitepress/theme/components/**/*.vue"
  biome:
    exclude_paths:
      - "website/.vitepress/theme/components/*.vue"
      - "website/.vitepress/theme/components/**/*.vue"
  # CSSLint predates custom properties, :has() and modern color syntax.
  # Stylelint remains enabled for this file.
  csslint:
    exclude_paths:
      - "website/.vitepress/theme/vars.css"
  markdownlint:
    exclude_paths:
      - "PRIVACY_POLICY.md"
  opengrep:
    exclude_paths:
      - "lib/native/rust/**"
      - "lib/native/ebpf-bridge/**"
      - "pack/native/**"
      - "scripts/**/*.py"
  cppcheck:
    exclude_paths:
      - "pack/native/loader.c"
      - "lib/native/go/native/bridge.c"
      - "lib/native/go/native/trace.c"
  deadcode:
    exclude_paths:
      - "lib/native/go/**"
