[package]
name = "ebpf-bridge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "libebpfbridge"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
panic = "abort"
codegen-units = 1
debug = false
incremental = false
overflow-checks = false
debug-assertions = false
strip = "symbols"
